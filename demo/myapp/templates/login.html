<!DOCTYPE html>

<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}">

    <link rel="stylesheet" href="{% static 'CSS/login_style.css' %}">

</head>

<body>
    {% block content %}
    <div class="login-container">

        <div class="login-image">

            <img src="{% static 'MEDIA/login.jpg' %}" alt="Imagine login">

        </div>

       

        <!-- Separatorul dintre imagine și formular -->

        <div class="separator"></div>



        <div class="login-form">

            <h2>Login</h2>

            <form id="loginForm">

                <input type="email" id="email" placeholder="Email" required>

                <input type="password" id="password" placeholder="Parola" required>

                <button type="submit">Login</button>

            </form>

            <p class="register-text">Nu ai cont? <a href="{% static 'HTML/register.html' %}">Înregistrează-te</a></p>

        </div>

    </div>

    <script src="{% static 'JS/login_js.js' %}"></script>
    {% endblock %}
</body>

</html>
