<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Gallery</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container my-4">
    <h1 class="mb-4">Galerie Bootstrap 5</h1>
    
    <div class="row g-3">
      <!-- Un card per rând pe ecran mic (col-12), două carduri per rând de la md (col-md-6) -->
      <div class="col-12 col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Card 1</h5>
            <p class="card-text">Descrierea primului card.</p>
            <a href="#" class="btn btn-primary">Află mai multe</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Card 2</h5>
            <p class="card-text">Descrierea celui de-al doilea card.</p>
            <button type="button" class="btn btn-secondary">Acțiune interactivă</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
