<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universități din România</title>
  <link rel="stylesheet" href="../CSS/universities_style.css">
</head>
<body>

  <div>
    <h1>Universități din România</h1>
    
    <label for="q">Filtru (opțional):</label>
    <input id="q" placeholder="caută după nume..." />
    
    <!-- Pasul 5: Butonul de Export CSV -->
    <button id="exportBtn">Export CSV</button>
    
    <div id="status" class="status"></div>
    
    <table>
      <thead>
        <tr>
          <th>Nume</th>
          <th>Țara</th>
          <th>Site</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- Pasul 4: Integrare script JavaScript -->
  <script src="../JS/universities_js.js"></script>
</body>
</html>
