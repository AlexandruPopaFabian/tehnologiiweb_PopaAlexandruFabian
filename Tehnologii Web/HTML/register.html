<!DOCTYPE html>
<html lang="ro">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pagina de register</title>
        <link rel="stylesheet" href="../CSS/style.css">
        <link rel="stylesheet" href="../CSS/register_style.css">
    </head>
    <body>
        <main class="page">
        <section class="card">
        <h1></h1>
        <form class="register-form" action="#" method="post" enctype="multipart/form-data">
        <div class="row">
            <label for="username">Username</label>
            <input type="text" name="username" placeholder="ex:ioanaTW" required>
        </div>
        <div class="row">
            <label for="email">Email</label>
            <input type="..." name="email" placeholder="..." required>
        </div>
        <div class="row two-col">
            <div>
                <label for="password">Parolă</label>
                <input ...="password" name="..." required>
            </div>
        <div>
            <label for="confirm_password">Confirmă parola</label>
            <input type="password" name="confirm_password" required>
        </div>
        </div>


        <div class="actions">
            <button type="submit" class="btn primary">Creeaza cont</button>
            <button type="reset" class="btn ghost">Reseteaza</button>
        </div>
        <p class="login-link"> Ai deja cont?

        <a href="login.html">Mergi la login</a></p>

        </form>
        </section>
        </main>
    </body>
</html>
